<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Imagem social do Play JM (1200x630)</title>
<style>
  @font-face { font-family: "Press Start 2P"; src: url("../../assets/fonts/press-start-2p-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter Variable"; src: url("../../assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #1b1d1a; color: #f2eee6; font-family: "Inter Variable", sans-serif; overflow: hidden; }
  .moldura { position: absolute; inset: 28px; border: 6px solid #8e9491; background: #262824; box-shadow: 14px 14px 0 #a66a4c; display: flex; align-items: center; gap: 36px; padding: 0 64px; }
  .icone { width: 360px; height: 360px; flex: none; object-fit: contain; }
  .texto { display: flex; flex-direction: column; }
  .kicker { font-family: "Press Start 2P"; font-size: 22px; letter-spacing: 1px; color: #c48d6e; }
  .titulo { margin-top: 28px; font-family: "Press Start 2P"; font-size: 76px; line-height: 1.2; }
  .sub { margin-top: 28px; font-size: 38px; font-weight: 500; color: #c9c2b6; }
  .endereco { margin-top: 44px; font-family: "Press Start 2P"; font-size: 22px; color: #c48d6e; }
</style>
</head>
<body>
  <div class="moldura">
    <img class="icone" src="../../assets/icons/controle-256.png" alt="" />
    <div class="texto">
      <p class="kicker">SAPO PIXELADO</p>
      <p class="titulo">PLAY JM</p>
      <p class="sub">Jogos e pixel art</p>
      <p class="endereco">play.jm.dev.br</p>
    </div>
  </div>
</body>
</html>
